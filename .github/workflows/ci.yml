name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pre-commit==4.3.0
      - run: pre-commit run --all-files
      - name: Scan full history
        run: |
          scanner=$(find "$HOME/.cache/pre-commit" -type f -name gitleaks -perm -111 -print -quit)
          test -n "$scanner"
          "$scanner" git . --redact --log-opts="--all"
